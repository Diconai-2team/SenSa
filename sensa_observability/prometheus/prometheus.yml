# ============================================================
# Prometheus scrape config — sensa_default 네트워크로 컨테이너 직접 접근
# ============================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sensa_local'

scrape_configs:
  # ─── SenSa Django (컨테이너 이름 직접) ───
  - job_name: 'sensa-django'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sensa-django:8000']
        labels:
          service: 'django'

  # ─── SenSa FastAPI Generator (컨테이너 이름 직접) ───
  - job_name: 'sensa-generator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sensa_generator:8001']
        labels:
          service: 'generator'

  # ─── SenSa Celery worker (컨테이너 이름 직접) ───
  - job_name: 'sensa-celery'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sensa_celery:9809']
        labels:
          service: 'celery'

  # ─── Prometheus 자체 ───
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
