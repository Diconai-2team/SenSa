<!-- section_09_map.html — ⑨ 탭 네비게이션 + 지도 + 오버레이 -->
<!-- 탭 -->
<nav id="section-09-tabs">
  <button class="tab-btn active" data-tab="all">전체</button>
  <button class="tab-btn" data-tab="workers">작업자</button>
  <button class="tab-btn" data-tab="geofence">위험구역</button>
  <button class="tab-btn" data-tab="gas">유해가스 센서</button>
  <button class="tab-btn" data-tab="equipment">설비</button>
  <button class="tab-btn" data-tab="power">스마트 전력 시스템</button>
  <button class="tab-btn" data-tab="location">위치 센서</button>
</nav>

<!-- 지도 -->
<div id="map-area">
  <div id="map-toolbar">
    <span>📍 실시간 모니터링</span>
    <span id="coord-display">x: –, y: –</span>
    <button id="draw-fence-btn" class="toolbar-btn primary" onclick="toggleDrawMode()">✏️ 지오펜스 그리기</button>
    <button id="clear-draw-btn" class="toolbar-btn secondary" onclick="clearCurrentDraw()">↩ 취소</button>
  </div>

  <div id="map"></div>

  <!-- ═══════════════════════════════════════════════════════════
       R&D 시나리오 오버레이 (Phase J — 확산 모델 기반)
       운영 sensor 기반 시연. 누출원 1개 → 그레이엄 확산 → 영향 sensor
       자동 detect → spike SensorData 주입 + zone 생성.
       90~120초 후 자연 만료.
       ═══════════════════════════════════════════════════════════ -->
  <div id="rd-scenario-overlay">
    <div class="rd-header">🧪 R&D 시나리오 (운영)</div>
    <button class="rd-scenario-btn confirmed" data-scenario="op_single"
            onclick="runRdScenario('op_single', this)">
      🟡 단일 누출 <small>외곽 sensor 격리 누출</small>
    </button>
    <button class="rd-scenario-btn critical" data-scenario="op_multi"
            onclick="runRdScenario('op_multi', this)">
      🔴 다중 누출 <small>확산 → 다수 sensor 영향</small>
    </button>
    <button class="rd-scenario-btn critical" data-scenario="op_h2s"
            onclick="runRdScenario('op_h2s', this)">
      💀 H2S 급격 <small>다른 가스 도메인</small>
    </button>
    <button class="rd-cleanup-btn" onclick="cleanupRdScenarios(this)">
      🧹 시나리오 정리
    </button>
    <div id="rd-scenario-status">대기 중</div>
  </div>



  <!-- 레이어 토글 -->
  <!-- control-overlay: 레이어 + 가스 탭 통합 컨트롤 패널 -->
  <div id="control-overlay">
    <div class="co-header">
      <span class="co-title">⚙ 컨트롤</span>
      <button class="co-collapse" id="co-collapse" type="button" aria-label="패널 접기">▾</button>
    </div>
    <div class="co-body" id="co-body">
      <div class="co-tabs">
        <button class="co-tab active" type="button" data-tab="layer">레이어</button>
        <button class="co-tab" type="button" data-tab="gas">가스 <span class="co-tab-badge" id="co-gas-badge">9</span></button>
      </div>
      <div class="co-pane active" data-pane="layer">
        <div class="layer-toggle"><label>⚠️ 지오펜스</label><label class="toggle-switch"><input type="checkbox" id="layer-geofence" checked><span class="slider"></span></label></div>
        <div class="layer-toggle"><label>📡 센서</label><label class="toggle-switch"><input type="checkbox" id="layer-sensor" checked><span class="slider"></span></label></div>
        <div class="layer-toggle"><label>👷 작업자</label><label class="toggle-switch"><input type="checkbox" id="layer-worker" checked><span class="slider"></span></label></div>
      </div>
      <div class="co-pane" data-pane="gas">
        <div class="gt-master"><span>전체</span><button class="gt-tg on" id="gt-master" type="button" aria-label="전체 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="o2"><span class="gt-dot"></span><span class="gt-name">O₂<small>산소</small></span><button class="gt-tg on" type="button" aria-label="O₂ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="co"><span class="gt-dot"></span><span class="gt-name">CO<small>일산화탄소</small></span><button class="gt-tg on" type="button" aria-label="CO 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="co2"><span class="gt-dot"></span><span class="gt-name">CO₂<small>이산화탄소</small></span><button class="gt-tg on" type="button" aria-label="CO₂ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="h2s"><span class="gt-dot"></span><span class="gt-name">H₂S<small>황화수소</small></span><button class="gt-tg on" type="button" aria-label="H₂S 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="no2"><span class="gt-dot"></span><span class="gt-name">NO₂<small>이산화질소</small></span><button class="gt-tg on" type="button" aria-label="NO₂ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="so2"><span class="gt-dot"></span><span class="gt-name">SO₂<small>이산화황</small></span><button class="gt-tg on" type="button" aria-label="SO₂ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="o3"><span class="gt-dot"></span><span class="gt-name">O₃<small>오존</small></span><button class="gt-tg on" type="button" aria-label="O₃ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="nh3"><span class="gt-dot"></span><span class="gt-name">NH₃<small>암모니아</small></span><button class="gt-tg on" type="button" aria-label="NH₃ 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
        <div class="gt-row on" data-gas="voc"><span class="gt-dot"></span><span class="gt-name">VOC<small>휘발성유기</small></span><button class="gt-tg on" type="button" aria-label="VOC 토글" aria-pressed="true"><span class="gt-thumb"></span></button></div>
      </div>
    </div>
  </div>
  <script>
  (function() {
    var ov = document.getElementById('control-overlay');
    if (!ov || ov.dataset.wired) return;
    ov.dataset.wired = '1';
    var tabs = ov.querySelectorAll('.co-tab');
    var panes = ov.querySelectorAll('.co-pane');
    tabs.forEach(function(t) {
      t.addEventListener('click', function() {
        tabs.forEach(function(x) { x.classList.remove('active'); });
        panes.forEach(function(x) { x.classList.remove('active'); });
        t.classList.add('active');
        ov.querySelector('.co-pane[data-pane="' + t.dataset.tab + '"]').classList.add('active');
      });
    });
    var col = document.getElementById('co-collapse');
    col.addEventListener('click', function() {
      var body = document.getElementById('co-body');
      var hidden = body.style.display === 'none';
      body.style.display = hidden ? '' : 'none';
      col.textContent = hidden ? '▾' : '▸';
    });
    function gasRow(g) { var v = document.getElementById('val-' + g); return v ? v.closest('tr') : null; }
    function apply(g, on) { var tr = gasRow(g); if (tr) tr.style.display = on ? '' : 'none'; }
    function count() {
      var rows = ov.querySelectorAll('.gt-row');
      var n = ov.querySelectorAll('.gt-row.on').length;
      var b = document.getElementById('co-gas-badge'); if (b) b.textContent = n;
      var m = document.getElementById('gt-master');
      var all = (n === rows.length); m.classList.toggle('on', all); m.setAttribute('aria-pressed', all);
    }
    ov.querySelectorAll('.gt-row').forEach(function(row) {
      row.querySelector('.gt-tg').addEventListener('click', function() {
        var on = !this.classList.contains('on');
        this.classList.toggle('on', on); row.classList.toggle('on', on);
        this.setAttribute('aria-pressed', on); apply(row.dataset.gas, on); count();
      });
    });
    document.getElementById('gt-master').addEventListener('click', function() {
      var on = !this.classList.contains('on');
      this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
      ov.querySelectorAll('.gt-row').forEach(function(row) {
        row.classList.toggle('on', on);
        var b = row.querySelector('.gt-tg'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
        apply(row.dataset.gas, on);
      });
      count();
    });
    count();
  })();
  </script>

  <!-- 업로드 -->
  <div id="upload-overlay">
    <div id="upload-area" onclick="document.getElementById('file-input').click()">
      <span class="upload-icon">📐</span>
      <strong id="upload-label">평면도 업로드</strong>
      <p>JPG, PNG</p>
    </div>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="alarm-toast-container"></div>
  <div id="draw-hint">클릭으로 꼭짓점 추가 → 첫 점 재클릭으로 완성 (최소 3개)</div>
</div>

<!-- 지오펜스 모달 -->
<div id="fence-modal">
  <div class="modal-box">
    <h2>⚠️ 위험 구역 저장</h2>
    <div class="form-group"><label>구역명 *</label><input type="text" id="fence-name" placeholder="예: 위험구역 A"></div>
    <div class="form-group"><label>구역 유형</label><select id="fence-type"><option value="danger">위험</option><option value="caution">주의</option><option value="restricted">출입금지</option></select></div>
    <div class="form-group"><label>위험도</label><select id="fence-risk"><option value="critical">심각</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></div>
    <div class="form-group"><label>설명</label><textarea id="fence-desc" placeholder="구역 설명 (선택)"></textarea></div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">취소</button><button class="btn-primary" onclick="saveGeoFence()">저장</button></div>
  </div>
</div>
