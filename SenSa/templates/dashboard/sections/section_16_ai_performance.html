<!-- section_16_ai_performance.html — ⑯ AI 예측 성능 카드 -->
<div id="section-16-ai-performance" class="bottom-panel">
  <div class="bottom-panel-title">
    <span>🤖 AI 예측 성능</span>
    <a href="/dashboard/alarms/?level=ai" target="_blank"
       style="font-size:11px; color:#58a6ff; text-decoration:none;">+ 상세보기</a>
  </div>

  <!-- 통계 카드 4개 -->
  <div class="ai-perf-cards">
    <div class="ai-perf-card">
      <div class="ai-perf-label">총 예측</div>
      <div class="ai-perf-value" id="ai-total">—</div>
    </div>
    <div class="ai-perf-card success">
      <div class="ai-perf-label">✅ 성공</div>
      <div class="ai-perf-value" id="ai-success">—</div>
    </div>
    <div class="ai-perf-card failure">
      <div class="ai-perf-label">❌ 실패</div>
      <div class="ai-perf-value" id="ai-failure">—</div>
    </div>
    <div class="ai-perf-card accuracy">
      <div class="ai-perf-label">정확도</div>
      <div class="ai-perf-value" id="ai-accuracy">—</div>
    </div>
  </div>

  <!-- 검증 중 -->
  <div class="ai-perf-pending">
    검증 중 <span id="ai-pending">—</span>건
  </div>

  <!-- 최근 예측 목록 -->
  <div class="ai-perf-list" id="ai-pred-list">
    <div class="ai-perf-empty">데이터 로딩 중...</div>
  </div>
</div>

<style>
#section-16-ai-performance {
  min-width: 280px;
}
.ai-perf-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 8px 12px 4px;
}
.ai-perf-card {
  background: var(--bg, #161b22);
  border: 1px solid var(--border, #21262d);
  border-radius: 6px;
  padding: 8px 6px;
  text-align: center;
}
.ai-perf-card.success  { border-color: #2ecc7166; }
.ai-perf-card.failure  { border-color: #e74c3c66; }
.ai-perf-card.accuracy { border-color: #58a6ff66; }
.ai-perf-label {
  font-size: 10px;
  color: var(--text-dim, #6e7681);
  margin-bottom: 4px;
}
.ai-perf-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text, #c9d1d9);
}
.ai-perf-card.success  .ai-perf-value { color: #2ecc71; }
.ai-perf-card.failure  .ai-perf-value { color: #e74c3c; }
.ai-perf-card.accuracy .ai-perf-value { color: #58a6ff; }
.ai-perf-pending {
  font-size: 11px;
  color: var(--text-dim, #6e7681);
  padding: 2px 14px 6px;
}
.ai-perf-list {
  padding: 4px 12px 8px;
  max-height: 120px;
  overflow-y: auto;
}
.ai-perf-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px solid var(--border, #21262d);
  font-size: 11px;
}
.ai-perf-item:last-child { border-bottom: none; }
.ai-perf-item .pred-msg  { color: var(--text, #c9d1d9); flex: 1; }
.ai-perf-item .pred-result {
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 4px; margin-left: 6px;
  white-space: nowrap;
}
.pred-result.success  { background: #1a3a1a; color: #2ecc71; }
.pred-result.failure  { background: #3a1a1a; color: #e74c3c; }
.pred-result.pending  { background: #1a2a3a; color: #58a6ff; }
.ai-perf-empty { font-size: 11px; color: var(--text-dim, #6e7681); text-align: center; padding: 16px 0; }
</style>

<script>
(function() {
  var RESULT_LABEL = { success: '성공', failure: '실패', pending: '검증중' };

  async function loadAiStats() {
    try {
      var res = await fetch('/dashboard/api/alarm/ai_stats/', { credentials: 'include' });
      if (!res.ok) return;
      var d = await res.json();

      document.getElementById('ai-total').textContent   = d.total;
      document.getElementById('ai-success').textContent = d.success;
      document.getElementById('ai-failure').textContent = d.failure;
      document.getElementById('ai-pending').textContent = d.pending;
      document.getElementById('ai-accuracy').textContent =
        d.accuracy > 0 ? d.accuracy + '%' : '—';
    } catch(e) {}
  }

  async function loadAiPredictions() {
    try {
      var res = await fetch('/dashboard/api/ai-predictions/?limit=5', { credentials: 'include' });
      if (!res.ok) return;
      var d = await res.json();
      var list = d.results || d;
      var el = document.getElementById('ai-pred-list');
      if (!list.length) {
        el.innerHTML = '<div class="ai-perf-empty">예측 데이터 없음 (약 70틱 후 시작)</div>';
        return;
      }
      el.innerHTML = list.map(function(p) {
        var resultClass = p.result;
        var resultText  = RESULT_LABEL[p.result] || p.result;
        return '<div class="ai-perf-item">' +
          '<span class="pred-msg">' + p.device_id + ' ' + p.sensor_key.toUpperCase() +
          ' → ' + p.predicted_value + '</span>' +
          '<span class="pred-result ' + resultClass + '">' + resultText + '</span>' +
          '</div>';
      }).join('');
    } catch(e) {}
  }

  function refresh() {
    loadAiStats();
    loadAiPredictions();
  }

  refresh();
  setInterval(refresh, 10000); // 10초마다 갱신
})();
</script>
