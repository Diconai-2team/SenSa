<!-- section_14_15_power.html — ⑭ 전력 테이블 + ⑮ AI 예측 전력
     F4-HTML 변경: ⑮ 영역에 전력 변수 캐러셀 헤더 + 카드 2개 추가.
                    가스 13번 (F2) 패턴 그대로 + section_16 의 .ai-perf-card 재활용.
                    JS 연동은 F4-JS 에서. -->

<!-- ⑭ 스마트 전력 시스템 -->
<div id="section-14-power-table" class="bottom-panel">
  <div class="bottom-panel-title">
    <span>스마트 전력 시스템 위험 현황 — <span id="power-current-name" class="sensor-pager-name">…</span></span>
    <div class="sensor-pager">
      <button class="sensor-pager-btn" id="power-pager-prev" type="button" aria-label="이전 설비" disabled>‹</button>
      <span class="sensor-pager-index"><span id="power-pager-cur">0</span> / <span id="power-pager-total">0</span></span>
      <button class="sensor-pager-btn" id="power-pager-next" type="button" aria-label="다음 설비" disabled>›</button>
    </div>
  </div>

  <!-- 전력 요약: 큰 글씨 = 전체 합산 / 작은 글씨 = 현재 설비 와트 -->
  <div class="power-summary" id="power-total-watt">
    0 <span class="unit">W</span>
    <span class="power-current-watt"><span id="power-cur-watt">0</span> W (현재 설비)</span>
  </div>

  <table class="data-table" id="power-status-table">
    <colgroup>
      <col style="width: 35%;">  <!-- 설비명 -->
      <col style="width: 22%;">  <!-- 전류 -->
      <col style="width: 22%;">  <!-- 전압 -->
      <col style="width: 21%;">  <!-- 위험도 -->
    </colgroup>
    <thead><tr><th>설비명</th><th>전류</th><th>전압</th><th>위험도</th></tr></thead>
    <tbody>
      <tr id="power-row-current">
        <td class="gas-name" id="power-row-name">—</td>
        <td class="gas-value" id="power-row-current-val">—</td>
        <td class="gas-value" id="power-row-voltage-val">—</td>
        <td><span class="status-badge status-normal" id="power-row-badge">—</span></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ⑮ AI 예측 - 스마트 전력 시스템 위험 (F4: 캐러셀 + 카드 골격 추가, JS 연동은 F4-JS) -->
<div id="section-15-power-chart" class="bottom-panel">
  <div class="bottom-panel-title">
    <span>AI 예측 - 스마트 전력 시스템 위험 — <span id="power-ai-name" class="sensor-pager-name">전류</span></span>
    <div class="sensor-pager">
      <button class="sensor-pager-btn" id="power-ai-prev" type="button" aria-label="이전 항목" disabled>‹</button>
      <span class="sensor-pager-index"><span id="power-ai-cur">1</span> / <span id="power-ai-total">4</span></span>
      <button class="sensor-pager-btn" id="power-ai-next" type="button" aria-label="다음 항목" disabled>›</button>
    </div>
    <a class="detail-link" style="font-size:10px; margin-left:8px;">+ 상세보기</a>
  </div>

  <!-- 카드 2개: 현재 값 + 12시간 내 최대 예상 — section_16 의 .ai-perf-card CSS 재활용 -->
  <div class="ai-perf-cards" style="grid-template-columns: repeat(2, 1fr); padding: 4px 12px 0;">
    <div class="ai-perf-card">
      <div class="ai-perf-label">현재 값</div>
      <div class="ai-perf-value" id="power-ai-current">—</div>
    </div>
    <div class="ai-perf-card accuracy">
      <div class="ai-perf-label">🤖 AI 예측 — 위험 분석</div>
      <div class="ai-perf-value" id="power-ai-forecast">—</div>
    </div>
  </div>

  <div class="chart-area"><canvas id="chart-power"></canvas></div>
</div>

<!-- F4 자체 fallback CSS — section_16 미로드 시 카드 스타일 유지 -->
<style>
#section-15-power-chart .ai-perf-cards {
  display: grid;
  gap: 6px;
}
#section-15-power-chart .ai-perf-card {
  background: var(--bg, #161b22);
  border: 1px solid var(--border, #21262d);
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}
#section-15-power-chart .ai-perf-card.accuracy { border-color: #58a6ff66; }
#section-15-power-chart .ai-perf-label {
  font-size: 10px;
  color: var(--text-dim, #6e7681);
  margin-bottom: 2px;
}
#section-15-power-chart .ai-perf-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--text, #c9d1d9);
}
#section-15-power-chart .ai-perf-card.accuracy .ai-perf-value { color: #58a6ff; }
</style>
