---
apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: sensa
spec:
  type: ClusterIP
  selector:
    app: django
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: sensa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: django
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U sensa -d sensa; do
                echo "[wait] postgres not ready, retry 2s"
                sleep 2
              done
        - name: migrate
          image: localhost:5000/sensa-app:latest
          imagePullPolicy: IfNotPresent
          command: ['python', 'manage.py', 'migrate', '--noinput']
          envFrom:
            - configMapRef: { name: sensa-config }
            - secretRef:    { name: sensa-secret }
      containers:
        - name: django
          image: localhost:5000/sensa-app:latest
          imagePullPolicy: IfNotPresent
          # runserver → daphne ASGI 전환 (handoff §5 line 228)
          command: ['daphne', '-b', '0.0.0.0', '-p', '8000', 'mysite.asgi:application']
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: sensa-config }
            - secretRef:    { name: sensa-secret }
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { memory: "256Mi", cpu: "500m" }   # HPA 시연: 평상 부하 흡수 (200m→500m, 14차)
            limits:   { memory: "1Gi",   cpu: "1000m" }
