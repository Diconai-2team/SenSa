# E단계 — Postgres StatefulSet + Service + PVC
# StatefulSet 사용 이유:
#   - 데이터 영속 (PVC 자동 바인딩 per Pod)
#   - 안정적 호스트명 (postgres-0)
#   - 일관된 시작 순서
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sensa
spec:
  type: ClusterIP
  clusterIP: None      # Headless Service — StatefulSet의 stable DNS 필수
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sensa
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: ["postgres", "-c", "max_connections=200"]
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: sensa-config
            - secretRef:
                name: sensa-secret
          # PostgreSQL 공식 이미지가 이 경로의 PGDATA 사용
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata    # PVC 루트 권한 충돌 방지
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sensa", "-d", "sensa"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sensa", "-d", "sensa"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName 생략 시 Docker Desktop 기본 'hostpath' 사용
