      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sensa
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sensa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED,    value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE,   value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM,   value: "true" }
            - { name: GF_SECURITY_ADMIN_PASSWORD,   value: "sensa_admin" }
            - { name: GF_USERS_DEFAULT_THEME,       value: "dark" }
            - { name: GF_LOG_LEVEL,                 value: "warn" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sensa-secret, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: datasource
          configMap: { name: grafana-datasource }
        - name: provider
          configMap: { name: grafana-provider }
        - name: dashboard
          configMap: { name: grafana-dashboard }
        - name: data
          emptyDir: {}
