# ============================================================
# G단계 — Grafana (K8s)
# Compose는 Dockerfile COPY로 dashboards/provisioning 내장.
# K8s는 ConfigMap 3개로 분리 mount:
#   - grafana-datasource : provisioning/datasources (url=http://prometheus:9090)
#   - grafana-provider   : provisioning/dashboards (path=/etc/grafana/dashboards)
#   - grafana-dashboard  : sensa.json (18 패널, 안전 관리자 친화 라벨 v2)
# 익명 Admin 로그인(시연 편의) = Compose 설정 계승.
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: sensa
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: SensaPostgres
        uid: sensa_pg
        type: postgres
        access: proxy
        url: postgres:5432
        user: sensa
        jsonData:
          database: sensa
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: ${POSTGRES_PASSWORD}
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provider
  namespace: sensa
data:
  sensa_provider.yml: |
    apiVersion: 1
    providers:
      - name: 'SenSa'
        orgId: 1
        folder: 'SenSa'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false

---
