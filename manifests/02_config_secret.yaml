# E단계 — ConfigMap + Secret
# 비밀이 아닌 설정은 ConfigMap에, 비밀번호·키는 Secret에 분리.
# 모든 Pod이 이 두 리소스를 envFrom으로 일괄 주입받음.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensa-config
  namespace: sensa
data:
  # Postgres 연결 정보 (K8s Service 이름 = 'postgres')
  POSTGRES_DB: "sensa"
  POSTGRES_USER: "sensa"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  # Redis 연결 정보 (K8s Service 이름 = 'redis')
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Django 설정
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,host.docker.internal,172.24.11.94,django,django.sensa,django.sensa.svc.cluster.local,sensa.localhost,grafana.localhost"
  DB_ENGINE: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: sensa-secret
  namespace: sensa
type: Opaque
stringData:
  # stringData는 Base64 인코딩 자동 처리 (편의)
  POSTGRES_PASSWORD: "csw13158297!"
  SECRET_KEY: "django-insecure-dev-change-this-in-production"
  INTERNAL_API_KEY: "change-me-to-a-long-random-string-in-production"
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1512356696884772965/jnUSW4cxO8lpXFK9-CCvgoz81IFWypYZa4W5MI-KcGleXGLVVcEv9ICLP86_yoRPX0hJ"
