---
apiVersion: v1
kind: Service
metadata:
  name: generator
  namespace: sensa
spec:
  type: ClusterIP
  selector:
    app: generator
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: sensa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generator
  template:
    metadata:
      labels:
        app: generator
    spec:
      initContainers:
        - name: wait-django
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -T 5 -O /dev/null http://django:8000/metrics 2>/dev/null; do
                echo "[wait] django not ready"
                sleep 3
              done
      containers:
        - name: generator
          image: localhost:5000/sensa-generator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef: { name: sensa-config }
            - secretRef:    { name: sensa-secret }
          env:
            # Compose 측정 결과 — generator는 DJANGO_BASE_URL 변수를 읽음
            - name: DJANGO_BASE_URL
              value: "http://django:8000"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
